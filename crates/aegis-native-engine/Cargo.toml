[package]
name = "aegis-native-engine"
version = "0.1.0"
edition = "2021"
description = "Deployment-neutral core contracts for Aegis Native Security Engine"
license = "Apache-2.0"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
url = "2"

[dev-dependencies]
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
