[package]
name = "aegis-native-http"
version = "0.1.0"
edition = "2021"
description = "Sandboxed async HTTP adapter for Aegis Native Security Engine"
license = "Apache-2.0"
publish = false

[dependencies]
aegis-native-engine = { path = "../aegis-native-engine" }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["macros", "net", "sync", "time"] }
url = "2"
zeroize = "1"

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "test-util", "time"] }

[lints.rust]
unsafe_code = "forbid"
